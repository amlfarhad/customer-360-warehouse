name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests -q
      - name: Run demo
        run: python -m src.cli demo --workspace . --accounts 250 --seed 42

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser-test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start static workspace
        run: python -m http.server 4176 --directory app > /tmp/customer-health-server.log 2>&1 &
      - name: Run browser smoke test
        env:
          BASE_URL: http://127.0.0.1:4176
        run: python tests/browser_smoke.py
